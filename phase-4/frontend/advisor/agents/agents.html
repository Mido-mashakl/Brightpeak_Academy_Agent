<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agents — Brightpeak Advisor Portal</title>
<link rel="stylesheet" href="../shared/advisor-shared.css" />
<link rel="stylesheet" href="agents.css" />
</head>
<body>
  <div class="bp-shell">
    <aside class="bp-sidebar" id="bp-sidebar"></aside>

    <div class="bp-main">
      <header class="bp-topbar" id="bp-topbar"></header>

      <main class="bp-content">
        <div class="bp-page-head">
          <h1>AI Agents</h1>
          <p class="bp-muted">Intelligent assistants powering academic advisory.</p>
        </div>

        <div class="bp-agents-grid" id="bp-agents-grid"></div>

        <div class="bp-card bp-workflow-card">
          <h2 class="bp-card-title">Agent Workflow</h2>
          <div class="bp-workflow-row" id="bp-workflow-row"></div>
          <img class="bp-neon-wave" src="../assets/neon-wave.png" alt="" onerror="this.style.display='none'" />
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/advisor-nav.js"></script>
  <script src="../shared/advisor-api.js"></script>
  <script src="agents.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request Detail — Brightpeak Advisor Portal</title>
<link rel="stylesheet" href="../shared/advisor-shared.css" />
<link rel="stylesheet" href="request-detail.css" />
</head>
<body>
  <div class="bp-shell">
    <aside class="bp-sidebar" id="bp-sidebar"></aside>

    <div class="bp-main">
      <header class="bp-topbar" id="bp-topbar"></header>

      <main class="bp-content">
        <div class="bp-detail-head">
          <div>
            <h1>Request Details <span class="bp-muted bp-mono" id="bp-req-id"></span></h1>
          </div>
        </div>

        <div class="bp-card bp-summary-card" id="bp-summary"></div>

        <div class="bp-card bp-timeline-card">
          <div class="bp-timeline" id="bp-timeline"></div>
        </div>

        <div class="bp-tabs" id="bp-detail-tabs">
          <button class="bp-tab active" data-tab="info">Request Info</button>
          <button class="bp-tab" data-tab="requirements">Requirements</button>
          <button class="bp-tab" data-tab="academic">Academic Data</button>
          <button class="bp-tab" data-tab="policy">Policy &amp; Documents</button>
          <button class="bp-tab" data-tab="ai">AI Analysis</button>
        </div>

        <div class="bp-tab-panels" id="bp-tab-panels"></div>

        <div class="bp-detail-actions">
          <a class="bp-btn" id="bp-hitl-link" href="../hitl/hitl.html">Send to HITL Review →</a>
        </div>
      </main>
    </div>
  </div>

  <script src="../shared/advisor-nav.js"></script>
  <script src="../shared/advisor-api.js"></script>
  <script src="request-detail.js"></script>
</body>
</html>

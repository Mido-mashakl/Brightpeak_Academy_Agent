<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Requests — Brightpeak Advisor Portal</title>
<link rel="stylesheet" href="../shared/advisor-shared.css" />
<link rel="stylesheet" href="requests.css" />
</head>
<body>
  <div class="bp-shell">
    <aside class="bp-sidebar" id="bp-sidebar"></aside>

    <div class="bp-main">
      <header class="bp-topbar" id="bp-topbar"></header>

      <main class="bp-content">
        <div class="bp-page-head">
          <h1>Requests</h1>
          <p class="bp-muted">Certificate and scholarship requests</p>
        </div>

        <div class="bp-filters-row">
          <div class="bp-tabs" id="bp-tabs">
            <button class="bp-tab active" data-type="all">All</button>
            <button class="bp-tab" data-type="certificate">Certificate</button>
            <button class="bp-tab" data-type="scholarship">Scholarship</button>
          </div>
          <button class="bp-btn ghost">⚙ Filters</button>
        </div>

        <div class="bp-card bp-table-card">
          <table class="bp-table">
            <thead>
              <tr>
                <th>Request ID</th>
                <th>Student</th>
                <th>Type</th>
                <th>Status</th>
                <th>Updated</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="bp-requests-body"></tbody>
          </table>
          <div class="bp-table-footer">
            <span id="bp-showing" class="bp-muted"></span>
            <div class="bp-pagination" id="bp-pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../shared/auth.js"></script>
  <script src="../shared/auth-guard.js"></script>
  <script src="../shared/advisor-nav.js"></script>
  <script src="../shared/advisor-api.js"></script>
  <script src="requests.js"></script>
</body>
</html>

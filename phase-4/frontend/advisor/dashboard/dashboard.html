<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Brightpeak Advisor Portal</title>
<link rel="stylesheet" href="../shared/advisor-shared.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="bp-shell">
    <aside class="bp-sidebar" id="bp-sidebar"></aside>

    <div class="bp-main">
      <header class="bp-topbar" id="bp-topbar"></header>

      <main class="bp-content">
        <section class="bp-hero bp-card">
          <div class="bp-hero-text">
            <h1 id="bp-greeting">Good morning, <span class="accent">Advisor</span> 👋</h1>
            <p class="bp-muted">Here's your advisory overview for today.</p>

            <div class="bp-stats" id="bp-stats"></div>
          </div>
          <div class="bp-hero-mascot">
            <img src="../assets/robot-wave.png" alt="Advisor AI assistant mascot" onerror="this.style.display='none'" />
          </div>
        </section>

        <section class="bp-grid-lower">
          <div class="bp-card">
            <div class="bp-flex" style="justify-content:space-between;align-items:center;">
              <h2 class="bp-card-title" style="margin:0;">Requests Needing Attention</h2>
              <a href="../requests/requests.html" class="bp-link">View All</a>
            </div>
            <div id="bp-attention-list" class="bp-attention-list"></div>
          </div>

          <div class="bp-card bp-insights-card">
            <h2 class="bp-card-title">AI Insights</h2>
            <div id="bp-insights"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../shared/advisor-nav.js"></script>
  <script src="../shared/advisor-api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
